# The live scored run, on skills this repository owns.
#
# These suites are written alongside their skills, so min_pass_rate = 1.0 in
# skill-eval.toml: every case is expected to pass, and a red one is a real
# signal about the skill or the eval. Third-party drift cannot reach this job
# -- that is what canary.yml is for.
#
# Deliberately NOT on every push. The same suites replay from cassettes in
# validate.yml for free, so per-push spend would buy nothing: a recording
# already knows how the model answered. What this job adds is the one thing a
# cassette cannot -- catching the provider changing its behaviour underneath
# us. That is a weekly question, not a per-commit one.
#
# Re-record the cassettes when this goes red and the change is legitimate:
#   uv run pytest --record-mode=once
name: demo

on:
  schedule:
    # Mondays, 05:00 UTC -- an hour before the canary, so the owned suites are
    # already answered if both need reading on the same morning.
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # --baseline previous resolves a skill's prior version from git
          # history, so a shallow clone would leave it nothing to compare.
          fetch-depth: 0

      # @main, not @v1: skill-evaluator has no tags or releases yet. Move both
      # this ref and install-spec to the tag once it cuts one -- tracking main
      # means a change there can turn this build red without a commit here.
      - name: Evaluate the demo skills
        id: eval
        uses: EmadMokhtar/skill-evaluator@main
        with:
          path: ./skills
          config: ./skill-eval.toml
          markdown-max-chars: "60000"
          # The action's default install-spec is the PyPI name, which does not
          # exist yet.
          install-spec: "skill-eval[pydantic-ai] @ git+https://github.com/EmadMokhtar/skill-evaluator@main"
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-reports
          path: |
            skill-eval-report.json
            skill-eval-junit.xml
            skill-eval-summary.md
          if-no-files-found: warn
