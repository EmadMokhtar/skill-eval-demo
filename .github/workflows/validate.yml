# The gate that runs on every change: free, offline, deterministic, no key.
#
# Two layers, both zero-cost:
#   1. `skill-eval list` parses every case and validates every assertion kind,
#      regex, tool cross-reference and scaffold placeholder without a provider.
#   2. The cassette tests replay recorded traffic through the real runner and
#      judge, so every push gets the actual suites -- trajectories and rubric
#      verdicts included -- without paying tokens to re-learn what a recording
#      already knows.
#
# The live provider run lives in demo.yml, on a schedule. Cassettes catch
# regressions in the skills, the eval files and skill-eval itself; only a live
# run catches the provider moving underneath us.
name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned to an exact release: setup-uv's floating major tags stop at v7
      # while releases are past v10, so @v10 would not resolve.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true

      - name: Sync the environment
        run: uv sync

      - name: Validate the demo suites
        run: |
          uv run skill-eval list ./skills
          # `list` exits 0 on a tree with no cases at all, so assert the count
          # separately -- a suite that silently stopped being discovered would
          # otherwise read as a pass.
          test "$(uv run skill-eval list ./skills | grep -c ' case(s)')" -eq 2

      # Free, and the only thing that catches an upstream rename: sync.sh fails
      # loudly when a pinned skill no longer has a SKILL.md where our suite
      # expects one.
      - name: Prepare the canary tree
        run: ./canary/sync.sh

      - name: Validate the canary suites
        run: uv run skill-eval list ./canary/.work/skills

      # Replay-only. Never records, never reaches the network, and skips rather
      # than fails if a cassette was never recorded -- a missing recording says
      # nothing about the skill.
      - name: Replay the demo suites
        run: uv run pytest -rs
