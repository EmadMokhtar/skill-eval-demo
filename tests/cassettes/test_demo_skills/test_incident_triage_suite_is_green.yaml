        on-call for SEV1 and SEV2. Nothing else pages.** A SEV3 or SEV4 goes to the
        team\\nchannel and waits for working hours \\u2014 paging on those is how
        a rotation stops trusting\\npages at all.\\n\\nEscalating \\\"just in case\\\"
