      or an alert that needs a call on how far to escalate.\\n\\n# Incident triage\\n\\nDecide
      three things about an incident, in this order: its **severity**, whether to
      **page\\non-call**, and whether to **post a status-page update**. Each decision
      has a rule, and the\\nrules are not interchangeable \u2014 a customer-facing
      SEV3 still does not page.\\n\\n## Look it up first\\n\\nFetch the incident before
      deciding anything. Severity follows from the blast radius and\\nthe error rate
      recorded on the incident, not from how the reporter phrased it \u2014 \\\"the
      site\\nis down\\\" from one person is frequently one degraded region.\\n\\nNever
      set a severity, page, or post from the description alone.\\n\\n## Severity\\n\\n|
      Severity | Condition |\\n| --- | --- |\\n| SEV1 | Complete loss of a core capability,
