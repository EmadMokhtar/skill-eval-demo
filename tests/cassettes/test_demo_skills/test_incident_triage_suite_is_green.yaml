      when the user reports an outage, a degradation, or an alert that needs a call
      on how far to escalate.\\n\\n# Incident triage\\n\\nDecide three things about
      an incident, in this order: its **severity**, whether to **page\\non-call**,
      and whether to **post a status-page update**. Each decision has a rule, and
      the\\nrules are not interchangeable \u2014 a customer-facing SEV3 still does
      not page.\\n\\n## Look it up first\\n\\nFetch the incident before deciding anything.
      Severity follows from the blast radius and\\nthe error rate recorded on the
      incident, not from how the reporter phrased it \u2014 \\\"the site\\nis down\\\"
      from one person is frequently one degraded region.\\n\\nNever set a severity,
      page, or post from the description alone.\\n\\n## Severity\\n\\n| Severity |
      Condition |\\n| --- | --- |\\n| SEV1 | Complete loss of a core capability, or
      data loss or corruption of any size. |\\n| SEV2 | A core capability degraded
      for a large share of users, or fully broken for a small one. |\\n| SEV3 | Reduced
      quality with a workaround, or a non-core capability broken. |\\n| SEV4 | Cosmetic,
      internal-only, or already mitigated. |\\n\\nState the severity and the evidence
      you set it from. A severity asserted without the\\nnumber it came from is unreviewable.\\n\\n##
      Paging\\n\\n**Page on-call for SEV1 and SEV2. Nothing else pages.** A SEV3 or
      SEV4 goes to the team\\nchannel and waits for working hours \u2014 paging on
      those is how a rotation stops trusting\\npages at all.\\n\\nEscalating \\\"just
      in case\\\" is the failure mode this rule exists to stop. When the severity\\nis
      genuinely uncertain between SEV2 and SEV3, gather the missing evidence first;
      if it\\ncannot be gathered, treat it as the higher severity and say that is
      what you did.\\n\\n## Status page\\n\\n**Post only when the incident is customer-facing.**
      An internal-only incident \u2014 a broken\\nbuild pipeline, a staging outage,
      an internal dashboard \u2014 never goes to the status page,\\nwhatever its severity:
      a SEV1 on internal tooling is still invisible to customers, and\\nposting it
      invents an outage they did not have.\\n\\nSay plainly which of the three decisions
      you made and why.\",\"model\":\"gpt-5.6-luna\",\"reasoning\":{\"context\":\"all_turns\"},\"stream\":false,\"tool_choice\":\"auto\",\"tools\":[{\"name\":\"lookup_incident\",\"parameters\":{\"type\":\"object\",\"properties\":{\"incident_id\":{\"type\":\"string\"}},\"required\":[\"incident_id\"],\"additionalProperties\":false},\"type\":\"function\",\"description\":\"Fetch
