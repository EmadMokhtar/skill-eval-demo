        0.0,\n  \"incomplete_details\": null,\n  \"instructions\": \"# incident-triage\\n\\nTriage
        a production incident \\u2014 set its severity, decide whether to page on-call,
        and decide whether to post a status-page update. Use when the user reports
        an outage, a degradation, or an alert that needs a call on how far to escalate.\\n\\n#
        Incident triage\\n\\nDecide three things about an incident, in this order:
        its **severity**, whether to **page\\non-call**, and whether to **post a status-page
        update**. Each decision has a rule, and the\\nrules are not interchangeable
        \\u2014 a customer-facing SEV3 still does not page.\\n\\n## Look it up first\\n\\nFetch
        the incident before deciding anything. Severity follows from the blast radius
        and\\nthe error rate recorded on the incident, not from how the reporter phrased
        it \\u2014 \\\"the site\\nis down\\\" from one person is frequently one degraded
        region.\\n\\nNever set a severity, page, or post from the description alone.\\n\\n##
        Severity\\n\\n| Severity | Condition |\\n| --- | --- |\\n| SEV1 | Complete
        loss of a core capability, or data loss or corruption of any size. |\\n| SEV2
        | A core capability degraded for a large share of users, or fully broken for
        a small one. |\\n| SEV3 | Reduced quality with a workaround, or a non-core
        capability broken. |\\n| SEV4 | Cosmetic, internal-only, or already mitigated.
        |\\n\\nState the severity and the evidence you set it from. A severity asserted
