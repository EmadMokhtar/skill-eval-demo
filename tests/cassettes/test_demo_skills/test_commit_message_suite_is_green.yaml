      `refactor`, `test`, `perf`, `build`, `ci`,\\n  `chore`, `style`, `revert`.\\n-
      **Description** is imperative, lowercase, and ends without a full stop \u2014
      `add retry on\\n  timeout`, not `Added retry on timeout.`\\n- Keep the subject
      under 72 characters. Detail belongs in the body, which explains *why* \u2014\\n
      \ the diff already shows what.\\n\\n## Ask whether it breaks a caller\\n\\nBefore
      settling the subject, answer one question about the diff: **would existing code\\ncalling
      this still work?** A changed status code, a renamed or removed export, a new\\nrequired
      argument, a changed default, a narrowed return type \u2014 each breaks a caller.\\n\\nWhen
      the answer is no, the message carries both marks:\\n\\n```\\nfix(api)!: return
