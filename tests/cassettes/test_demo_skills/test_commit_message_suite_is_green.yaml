      {archived: true} for archived\\norders and now returns 404. Callers relying
      on the archived flag should treat 404\\nas archived.\\n```\\n\\nThe `!` goes
      after the type or scope; the `BREAKING CHANGE:` footer describes the\\nmigration.
      Both, every time \u2014 the `!` is what tooling reads, the footer is what the
      person\\nhitting the break reads. This is independent of the type: a `fix` can
      break a caller just\\nas a `feat` can.\\n\\n## Pick the type from the change,
      not the intent\\n\\nThe type describes what the commit does to the codebase:\\n\\n-
      A new capability a user can reach is `feat`, even if it took one line.\\n- A
      change to behaviour that was already meant to work is `fix`.\\n- Moving code
