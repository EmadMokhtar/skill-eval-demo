      a Conventional Commits subject line for staged changes. Use when the user is
      committing, asks for a commit message, or wants an existing message rewritten
      to the convention.\\n\\n# Commit message\\n\\nWrite the subject line for a commit,
      in [Conventional Commits](https://www.conventionalcommits.org/)\\nform. Release
      tooling derives versions from this history, so a message off the convention
      is a\\nbroken release, not an untidy log.\\n\\n## Read the change first\\n\\nRun
      the diff for the staged changes before writing anything. A message written from
      the\\nuser's description rather than the diff describes what they meant to do,
      which is not\\nalways what they did.\\n\\n## The form\\n\\n```\\n<type>[optional
      scope][!]: <description>\\n```\\n\\n- **Type** is one of `feat`, `fix`, `docs`,
      `refactor`, `test`, `perf`, `build`, `ci`,\\n  `chore`, `style`, `revert`.\\n-
      **Description** is imperative, lowercase, and ends without a full stop \u2014
      `add retry on\\n  timeout`, not `Added retry on timeout.`\\n- Keep the subject
      under 72 characters. Detail belongs in the body, which explains *why* \u2014\\n
      \ the diff already shows what.\\n\\n## Ask whether it breaks a caller\\n\\nBefore
      settling the subject, answer one question about the diff: **would existing code\\ncalling
      this still work?** A changed status code, a renamed or removed export, a new\\nrequired
      argument, a changed default, a narrowed return type \u2014 each breaks a caller.\\n\\nWhen
      the answer is no, the message carries both marks:\\n\\n```\\nfix(api)!: return
      404 for archived orders\\n\\nBREAKING CHANGE: GET /orders/:id returned 200 with
      {archived: true} for archived\\norders and now returns 404. Callers relying
      on the archived flag should treat 404\\nas archived.\\n```\\n\\nThe `!` goes
      after the type or scope; the `BREAKING CHANGE:` footer describes the\\nmigration.
      Both, every time \u2014 the `!` is what tooling reads, the footer is what the
      person\\nhitting the break reads. This is independent of the type: a `fix` can
      break a caller just\\nas a `feat` can.\\n\\n## Pick the type from the change,
      not the intent\\n\\nThe type describes what the commit does to the codebase:\\n\\n-
      A new capability a user can reach is `feat`, even if it took one line.\\n- A
      change to behaviour that was already meant to work is `fix`.\\n- Moving code
      without changing behaviour is `refactor`, even when it touches many files.\\n-
      A change only to tests is `test`; a change only to CI config is `ci`.\\n\\nWhen
      a change spans types, name the one that carries the user-visible outcome and
      describe\\nthe rest in the body.\\n\\n## Account for every hunk\\n\\nThe message
